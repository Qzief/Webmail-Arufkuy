<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - MailKuy</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo justify-center">
                    <img src="logo.png" alt="MailKuy Logo"
                        style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover; margin-right: 4px;">
                    MailKuy
                </div>
                <p class="login-subtitle">Welcome back to your smart inbox</p>
            </div>

            <form class="login-form" autocomplete="off" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="emailInput">Email address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="emailInput" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <div class="label-flex">
                        <label for="passwordInput" style="margin-bottom: 0;">Password</label>
                    </div>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="passwordInput" placeholder="••••••••" required
                            style="padding-right: 44px;">
                        <svg class="password-toggle" id="toggle-password" width="20" height="20" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round"
                            style="position: absolute; right: 16px; color: var(--text-muted); cursor: pointer;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember" checked>
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                </div>

                <button type="submit" id="btnLogin" class="btn-login" style="margin-bottom: 10px;">Sign in to
                    MailKuy</button>
                <div id="loginError"
                    style="color:var(--danger); margin-bottom: 14px; font-size:14px; text-align:center;">
                </div>

                <div class="auth-links" style="text-align: center; font-size: 14px; color: var(--text-secondary);">
                    Need help with password or account?
                    <a href="#" class="forgot-link"
                        style="color: var(--brand-primary); font-weight: 600; text-decoration: none;">Contact
                        Support</a>
                </div>
            </form>

            <div class="login-footer">
                <p>Secure, private, and smart.</p>
            </div>
        </div>
    </div>

    <!-- MAIN FIREBASE MODULE & DOM LOGIC -->
    <script type="module">
        import { auth } from './config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const $ = (id) => document.getElementById(id);
        const els = {
            emailInput: $("emailInput"),
            passwordInput: $("passwordInput"),
            btnLogin: $("btnLogin"),
            loginError: $("loginError")
        };

        // UI Interactions
        const togglePassword = $("toggle-password");
        if (togglePassword) {
            togglePassword.onclick = function () {
                const type = els.passwordInput.getAttribute("type") === "password" ? "text" : "password";
                els.passwordInput.setAttribute("type", type);
                if (type === "text") {
                    this.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                    this.style.color = "var(--text-primary)";
                } else {
                    this.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
                    this.style.color = "var(--text-muted)";
                }
            };
        }

        els.btnLogin.onclick = async () => {
            els.loginError.textContent = "";
            els.btnLogin.textContent = "Signing in...";
            els.btnLogin.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, els.emailInput.value.trim(), els.passwordInput.value.trim());
            } catch (e) {
                let errorMessage = "An unexpected error occurred. Please try again.";
                if (e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password') {
                    errorMessage = "Incorrect email address or password.";
                } else if (e.code === 'auth/too-many-requests') {
                    errorMessage = "Access temporarily disabled due to many failed attempts. Try again later.";
                } else if (e.code === 'auth/network-request-failed') {
                    errorMessage = "Network error. Please check your internet connection.";
                } else if (e.message) {
                    // Fallback to cleaner message if code doesn't match
                    errorMessage = e.message.replace("Firebase: ", "").split(" (")[0];
                }

                els.loginError.textContent = errorMessage;
                els.btnLogin.disabled = false;
                els.btnLogin.textContent = "Sign in to MailKuy";
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.location.href = "index.html";
            }
        });
    </script>
</body>


</html>
